name: Build check

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate digests and build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Validate digest front matter and dedup ledger
        run: python .github/scripts/validate_posts.py

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter --trace
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: pvelua/pvelua.github.io
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check links in changed digests
        run: |
          bundle exec htmlproofer ./_site \
            --no-enforce-https \
            --ignore-status-codes "403,429,503" \
            --swap-urls "^/:/" || echo "::warning::Link check reported issues - review before merging"
